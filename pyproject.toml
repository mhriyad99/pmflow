[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmflow"
version = "1.3.0"
description = "Manages processes"
readme = "README.md"
authors =[{name = "Md. Mahmudul Hasan Riyad", email = "mhriyad98@gmail.com"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["process manager", "process", "pm"]

dependencies = [
    "typer==0.12.5",
    "click>=7.1.1,<8.2.0",
    "psutil==6.0.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
]

requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/mhriyad99/process_manager"

[project.scripts]
pm = "pm.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
